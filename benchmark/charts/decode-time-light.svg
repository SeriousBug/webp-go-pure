<text x="40.0" y="550.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start">Every engine ends at packed RGBA, so x/image and wasm pay for converting their YCbCr planes inside the measurement, as an</text>
<text x="40.0" y="566.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start">application would. x/image is golang.org/x/image/webp, the Go project's own decoder, which has no encoder and so appears in this</text>
<text x="40.0" y="582.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start">figure alone.</text>
