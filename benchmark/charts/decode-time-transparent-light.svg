<text x="40.0" y="550.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start">Every engine ends at straight, non-premultiplied RGBA, so an engine that returns YCbCr planes or premultiplied pixels pays for</text>
<text x="40.0" y="566.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start">that conversion inside the measurement, as an application would. x/image is golang.org/x/image/webp, the Go project's own</text>
<text x="40.0" y="582.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start">decoder, which has no encoder and so appears in this figure alone.</text>
