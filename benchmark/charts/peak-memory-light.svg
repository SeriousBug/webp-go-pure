<text x="40.0" y="550.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start">One encode per process: source bitmap, runtime and encoder together, which is what an application pays. A 1080p frame is 2.1 MP</text>
<text x="40.0" y="566.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start">and a 4K frame roughly 10 MP, so multiply through to size a workload. wasm carries a WebAssembly runtime and its own linear</text>
<text x="40.0" y="582.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start">memory, which is why it costs more than the same encoder as C. nativewebp encodes VP8L only, so it has a bar in the lossless</text>
<text x="40.0" y="598.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start">panel alone.</text>
</svg>
