name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: CGO_ENABLED=0 go vet ./...
      - name: test (pure Go, cgo disabled)
        run: CGO_ENABLED=0 go test ./...
      - name: test (race detector)
        run: go test -race ./...

  # Guard the hand-written amd64/arm64 asm kernels and their generic fallbacks by
  # cross-compiling for every supported target with cgo disabled. riscv64 has no
  # asm kernels, so it exercises the generic fallback path. The codec assumes a
  # 64-bit int (WebP carries 32-bit size fields), so only 64-bit targets are built.
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...
