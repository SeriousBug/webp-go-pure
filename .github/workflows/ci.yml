name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Run the full suite natively on amd64 and arm64 so both architectures' asm
  # kernels are exercised for real, not just cross-compiled.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: CGO_ENABLED=0 go vet ./...
      - name: test (pure Go, cgo disabled)
        run: CGO_ENABLED=0 go test ./...
      - name: test (race detector)
        run: go test -race ./...

  # The examples in README.md and docs/ are the real code, not a copy of it.
  # glitterate extracts them into test files and go test runs them, so a snippet
  # that stops compiling, or an output line that stops being true, fails here.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: SeriousBug/glitterate@v1
        with:
          input: |
            README.md
            docs/**/*.md
      - name: examples
        run: CGO_ENABLED=0 go test -run 'Example' -v .

  # riscv64 has no native runner, so run a small conversion subset under QEMU
  # user-mode emulation to confirm the generic (non-asm) fallback path actually
  # produces correct output. Emulation is slow, so this is deliberately limited
  # to one encode test and one decode test, exercising the forward and inverse
  # transform fallbacks in both directions.
  test-riscv64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Register QEMU binfmt handlers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: test (riscv64 emulation, conversion subset)
        env:
          GOARCH: riscv64
          CGO_ENABLED: "0"
        run: go test -v -count=1 -run 'TestEncodeLossyRgbaToVp8RoundTripsAsLossyFrame|TestDecodeLossyWebpToRGBAMatchesReferencePixels' .

  # Guard the hand-written amd64/arm64 asm kernels and their generic fallbacks by
  # cross-compiling for every supported target with cgo disabled. riscv64 has no
  # asm kernels, so it exercises the generic fallback path. The codec assumes a
  # 64-bit int (WebP carries 32-bit size fields), so only 64-bit targets are built.
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...
